dependencies:
  cmd_nvs:
    path: ${IDF_PATH}/examples/system/console/advanced/components/cmd_nvs
  cmd_system:
    path: ${IDF_PATH}/examples/system/console/advanced/components/cmd_system
  espressif/esp_hosted:
    rules:
    - if: target in [esp32p4, esp32h2]
    version: '3.0.5'
  espressif/esp_wifi_remote:
    rules:
    - if: target in [esp32p4, esp32h2]
    - if: idf_version <6.1
    version: '>=1.3.1'
  joltwallet/littlefs:
    # NOTE: my earlier blanket sed pinned this to 3.0.5 too (esp_hosted's version)
    # and version solving failed. Only esp_hosted needs pinning here.
    version: '*'
